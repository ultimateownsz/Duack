<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duack — Web Sample (KNI / Blazor WASM)</title>
    <base href="./" />
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; overflow: hidden; }
        #app { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #theCanvas { display: block; width: 100vw; height: 100vh; background: #000; }
        #boot-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; cursor: pointer; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
        #boot-screen h1 { margin: 0 0 1rem 0; font-size: 2rem; color: #3b82f6; }
        #boot-screen p { margin: 0 0 2rem 0; font-size: 1.1rem; color: #ddd; }
        #boot-screen .start-btn { background: #3b82f6; color: #fff; border: none; border-radius: 6px; padding: 0.8rem 1.6rem; font-size: 1.1rem; cursor: pointer; }
        #boot-screen .start-btn:hover { background: #2563eb; }
        #blazor-error-ui { display:none; position:fixed; bottom:0; left:0; width:100%; padding:0.6rem 1.25rem; background:lightyellow; z-index:1000; }
        #blazor-error-ui .reload { color: inherit; }
        #blazor-error-ui .dismiss { cursor:pointer; position:absolute; right:0.75rem; top:0.5rem; }
    </style>
</head>
<body>
    <div id="app">Loading Duack web sample…</div>
    <div id="boot-screen">
        <h1>Duack — Web Sample</h1>
        <p>Click anywhere to start (browser requires a gesture for audio)</p>
        <button class="start-btn" id="start-btn">Start</button>
    </div>
    <div id="blazor-error-ui" style="display:none; position:fixed; bottom:0; left:0; width:100%; padding:0.6rem 1.25rem; background:lightyellow; z-index:1000;">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss" style="cursor:pointer; position:absolute; right:0.75rem; top:0.5rem;">x</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        (function () {
            var v = '10.0.3';
            var shims = [
                ['nkast.Wasm.JSInterop', 'JSObject'],
                ['nkast.Wasm.Dom',       'Window'],
                ['nkast.Wasm.Dom',       'Document'],
                ['nkast.Wasm.Dom',       'Navigator'],
                ['nkast.Wasm.Dom',       'Gamepad'],
                ['nkast.Wasm.Dom',       'Media'],
                ['nkast.Wasm.XHR',       'XHR'],
                ['nkast.Wasm.Canvas',    'Canvas'],
                ['nkast.Wasm.Canvas',    'CanvasGLContext'],
                ['nkast.Wasm.Audio',     'Audio'],
                ['nkast.Wasm.XR',        'XR']
            ];
            for (var i = 0; i < shims.length; i++) {
                document.write('<script src="_content/' + shims[i][0] + '/js/' + shims[i][1] + '.' + v + '.js"></scr' + 'ipt>');
            }
        })();
    </script>
    <script src="webaudio-sfx.js"></script>
    <script src="frb-host.js"></script>
</body>
</html>
