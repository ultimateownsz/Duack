name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Duack.slnx

      - name: Build (all projects, both TFMs represented)
        run: dotnet build Duack.slnx --no-restore -c Release

      - name: Test (core + adapters + tools + sample, headless)
        run: dotnet test Duack.slnx --no-build -c Release

      - name: Verify core is BCL-only (empty package cache)
        run: |
          CACHE_DIR="$RUNNER_TEMP/duack-empty-cache"
          rm -rf "$CACHE_DIR"
          mkdir -p "$CACHE_DIR"
          NUGET_PACKAGES="$CACHE_DIR" dotnet test tests/Duack.Tests/Duack.Tests.csproj --no-build -c Release
