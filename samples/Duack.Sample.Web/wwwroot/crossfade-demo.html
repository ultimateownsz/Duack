<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Duack — crossfade showcase</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --accent:#2e7d32; --warn:#ef6c00; --text:#1a1a1a; --muted:#5f6368; --border:#d0d3d9; }
    * { box-sizing:border-box; }
    body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); margin:0; padding:2rem; max-width:820px; margin-inline:auto; }
    h1 { margin:0 0 .25rem; }
    p.lead { color:var(--muted); margin:0 0 1.5rem; }
    .card { background:var(--card); border-radius:12px; padding:1.25rem; margin:1rem 0; box-shadow:0 2px 8px rgba(0,0,0,.08); border:1px solid var(--border); }
    .player { display:grid; grid-template-columns: 1fr 1fr; gap:1rem; }
    .playlist { list-style:none; padding:0; margin:0; }
    .playlist li { padding:.6rem .75rem; border:1px solid var(--border); border-radius:8px; margin:.35rem 0; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
    .playlist li:hover { background:#f0f1f3; }
    .playlist li.active { border-color:var(--accent); background:#e8f5e9; }
    .playlist li .vol { color:var(--muted); font-size:.8rem; }
    .controls { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
    button { padding:.55rem 1rem; border:1px solid var(--border); border-radius:8px; background:#fff; cursor:pointer; font:inherit; }
    button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    button:hover { filter:brightness(.95); }
    .toggle { display:flex; align-items:center; gap:.4rem; padding:.4rem .6rem; border:1px solid var(--border); border-radius:8px; }
    .slider { display:flex; align-items:center; gap:.5rem; }
    .slider input { width:160px; }
    canvas { width:100%; height:56px; border-radius:8px; background:#e8eaed; }
    .status { color:var(--muted); font-size:.9rem; margin-top:.5rem; min-height:1.2em; }
    .legend { display:flex; gap:1rem; font-size:.85rem; color:var(--muted); margin-top:.5rem; }
    .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:.3rem; vertical-align:middle; }
  </style>
</head>
<body>
  <h1>Duack — Crossfade Demo</h1>
  <p class="lead">Click a track to switch and crossfade. Pick a duration preset (4s/8s/12s/16s) to clearly hear tracks overlapping. Toggle crossfade off for an instant hard cut.</p>

  <div class="card player">
    <div>
      <h3 style="margin:0 0 .5rem">Tracks</h3>
      <ul class="playlist" id="playlist"></ul>
    </div>
    <div>
      <h3 style="margin:0 0 .5rem">Controls</h3>
      <div class="controls">
        <button id="prev" title="Previous">⏮</button>
        <button id="play" class="primary" title="Play/Pause">▶</button>
        <button id="next" title="Next">⏭</button>
      </div>
      <div class="controls" style="margin-top:.75rem; flex-wrap:wrap">
        <label class="toggle"><input type="checkbox" id="cf" checked /> Crossfade</label>
        <div class="controls" style="gap:.4rem">
          <span style="color:var(--muted); font-size:.9rem">Duration:</span>
          <button class="dur-preset" data-dur="4">4s</button>
          <button class="dur-preset" data-dur="8">8s</button>
          <button class="dur-preset" data-dur="12">12s</button>
          <button class="dur-preset" data-dur="16">16s</button>
        </div>
      </div>
      <p class="status" id="status">Idle — pick a track.</p>
      <div class="legend">
        <span><span class="dot" style="background:#2e7d32"></span>active</span>
        <span><span class="dot" style="background:#ef6c00"></span>transitioning</span>
      </div>
    </div>
  </div>

  <div class="card">
    <canvas id="meter" width="760" height="56"></canvas>
  </div>

  <script>
    const names = ["Track A — overworld", "Track B — battle", "Track C — hospital"];
    const srcs = ["Content/Audio/Tracks/overworld.ogg","Content/Audio/Tracks/battle.ogg","Content/Audio/Tracks/hospital.ogg"];
    const audios = srcs.map(s => { const a = new Audio(s); a.loop = true; a.preload = "auto"; return a; });

    let current = 0;
    let playing = false;
    let fading = false, fadeStart = 0, fadeDur = 1.5, fromIdx = -1, toIdx = -1;
    let crossfadeOn = true;

    const playlist = document.getElementById('playlist');
    names.forEach((n, i) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${n}</span><span class="vol" id="vol${i}">0.00</span>`;
      li.addEventListener('click', () => select(i));
      playlist.appendChild(li);
    });

    const playBtn = document.getElementById('play');
    const status = document.getElementById('status');
    const cf = document.getElementById('cf');
    const durPresets = document.querySelectorAll('.dur-preset');
    durPresets.forEach(btn => {
      btn.addEventListener('click', () => {
        fadeDur = parseFloat(btn.getAttribute('data-dur') || '4');
        durPresets.forEach(b => b.classList.toggle('primary', b === btn));
        status.textContent = `Crossfade duration set to ${fadeDur}s`;
      });
    });
    // default 4s
    const defBtn = document.querySelector('.dur-preset[data-dur="4"]');
    if (defBtn) defBtn.classList.add('primary');
    fadeDur = 4;
    cf.addEventListener('change', () => { crossfadeOn = cf.checked; });

    function select(i) {
      if (i === current && playing && !fading) { status.textContent = names[i] + ' already playing.'; return; }
      if (current === -1 || !crossfadeOn || fadeDur <= 0 || !playing) {
        // (re)start chosen track
        audios.forEach((a, idx) => { if (idx !== i) { a.pause(); a.currentTime = 0; a.volume = 0; } });
        const a = audios[i]; a.volume = 1; a.currentTime = 0;
        if (playing) a.play().catch(()=>{});
        current = i; fading = false;
        status.textContent = (playing ? 'Playing ' : 'Selected ') + names[i] + (crossfadeOn ? '' : ' (crossfade off)');
        return;
      }
      fromIdx = current; toIdx = i;
      fadeStart = performance.now(); fading = true;
      const a = audios[toIdx]; a.volume = 0; a.currentTime = 0; a.play().catch(()=>{});
      status.textContent = `Crossfading ${names[fromIdx]} → ${names[toIdx]}…`;
    }

    playBtn.addEventListener('click', () => {
      if (!playing) {
        playing = true; playBtn.textContent = '⏸';
        const a = audios[current]; a.volume = 1; a.currentTime = a.currentTime || 0; a.play().catch(()=>{});
        status.textContent = 'Playing ' + names[current];
      } else {
        playing = false; playBtn.textContent = '▶';
        audios.forEach(a => a.pause());
        status.textContent = 'Paused.';
      }
    });
    document.getElementById('next').addEventListener('click', () => { const n = (current+1)%names.length; select(n); if (!playing) { playing=true; playBtn.textContent='⏸'; audios[current].play().catch(()=>{}); } });
    document.getElementById('prev').addEventListener('click', () => { const n = (current-1+names.length)%names.length; select(n); if (!playing) { playing=true; playBtn.textContent='⏸'; audios[current].play().catch(()=>{}); } });

    const meter = document.getElementById('meter');
    const mctx = meter.getContext('2d');
    function tick() {
      if (fading && playing) {
        const t = Math.min(1, (performance.now() - fadeStart) / (fadeDur * 1000));
        const outGain = Math.cos(t * Math.PI / 2);
        const inGain = Math.sin(t * Math.PI / 2);
        if (fromIdx >= 0) audios[fromIdx].volume = outGain;
        audios[toIdx].volume = inGain;
        if (t >= 1) {
          if (fromIdx >= 0) { audios[fromIdx].pause(); audios[fromIdx].currentTime = 0; audios[fromIdx].volume = 0; }
          audios[toIdx].volume = 1;
          current = toIdx; fading = false; fromIdx = -1;
          status.textContent = 'Playing ' + names[current];
        }
      }
      // update playlist visuals
      document.querySelectorAll('.playlist li').forEach((el, idx) => {
        el.classList.toggle('active', idx === current);
        const v = document.getElementById('vol' + idx);
        if (v) v.textContent = audios[idx].volume.toFixed(2);
      });
      // meter
      mctx.fillStyle = '#e8eaed'; mctx.fillRect(0,0,meter.width,meter.height);
      audios.forEach((a, idx) => {
        const g = a.volume;
        mctx.fillStyle = idx === current ? '#2e7d32' : (idx === toIdx && fading ? '#ef6c00' : '#9aa0a6');
        mctx.fillRect(10 + idx*250, 14, 240*g, 28);
        mctx.fillStyle = '#1a1a1a'; mctx.font = '13px system-ui';
        mctx.fillText(names[idx] + '  ' + g.toFixed(2), 14 + idx*250, 33);
      });
      requestAnimationFrame(tick);
    }
    tick();

    // autoplay first track muted? no — wait for user
  </script>
</body>
</html>
