name: GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      - name: Publish crossfade demo (Duack.KNI WASM)
        run: dotnet publish samples/Duack.Sample.Crossfade/Duack.Sample.Crossfade.csproj -c Release -o _site_crossfade

      - name: Publish story demo (Duack.Sample.Web)
        run: dotnet publish samples/Duack.Sample.Web/Duack.Sample.Web.csproj -c Release -o _site_story

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r _site_story/wwwroot/* _site/
          mkdir -p _site/crossfade-demo
          cp -r _site_crossfade/wwwroot/* _site/crossfade-demo/
          cp _site/crossfade-demo/index.html _site/crossfade-demo.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4