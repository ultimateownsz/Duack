name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Duack.slnx

      - name: Build
        run: dotnet build Duack.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Duack.slnx --no-build -c Release

      - name: Verify core is BCL-only
        run: |
          $env:NUGET_PACKAGES = "$env:TEMP\duack-empty-cache"
          dotnet test tests/Duack.Tests/Duack.Tests.csproj --no-build -c Release

      - name: Pack
        run: |
          dotnet pack src/Duack/Duack.csproj -c Release -o artifacts
          dotnet pack src/Duack.MonoGame/Duack.MonoGame.csproj -c Release -o artifacts
          dotnet pack src/Duack.KNI/Duack.KNI.csproj -c Release -o artifacts

      - name: Push to NuGet
        run: |
          dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
